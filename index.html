<!DOCTYPE html>
<html lang="en">
<head>
  <title>TravelBestie</title>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="travel_recommendation.js"></script>
  <script src="travel_recommendation_api.json"></script>
   <style>
        body {
            background-image: url("Zanzibar.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .jumbotron {
            background-color: rgba(255, 255, 270, 0.5);
            padding: 2rem;
            border-radius: 10px;
            margin-top: 2rem; 
            text-align: left;
        }

        h1 { color: navy; }
        p { color: blue; font-size: 14px; font-family: Arial Black; }
        h2 { color: navy; font-size: 20px; }

        .container {
          flex: 1; 
          display: flex;
          justify-content: flex-start;
          align-items: flex-start; 
          padding-right: 15px;
          padding-left: 5%;
        }

        .fa {
          padding: 1px; font-size: 30px; width: 32px;
          text-align: center; text-decoration: none; margin: 5px 2px;
        }

        .fa-facebook { background: #3B5998; color: white; }
        .fa-twitter { background: #55ACEE; color: white; }
        .fa-youtube { background: #bb0000; color: white; }
        .fa-instagram { background: #125688; color: white; }

        main .cotainer {
          padding: 2rem 0;
          display: grid;
          grid-template-columns: repeat(1, 1fr);
          padding-left: 610px; /* This causes the mobile issue */
          overflow-y: scroll;
        }

        main img { width: 500px; height: 300px; }
        h3 { font-size: 18px; }
        #hidden-content { display: none; }

        .card {
          box-shadow: 0 14px 18px 0 rgba(0,0,0,0.2);
          transition: 0.3s;
          padding: 2px 16px;
          background: white;
        }

        /* Responsive Fix: Resetting the 610px gap for phones */
        @media only screen and (max-width: 992px) {
            .container { padding-left: 15px; justify-content: center; }
            .jumbotron { width: 100%; }
            main .cotainer { padding-left: 0; justify-items: center; }
            main img { width: 100%; height: auto; }
            .card { width: 95% !important; height: auto !important; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="javascript:void(0)"><img width="50" height="50" src="https://img.icons8.com/clouds/100/airplane-take-off.png" alt="airplane-take-off"/><i>TravelBestie</i></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="travel_recommendation.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="About_us.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="Contact_us.html">Contact Us</a></li>
      </ul>
      <form class="d-flex" onsubmit="event.preventDefault(); showResults();">
        <input class="form-control me-2" type="text" placeholder="Search" id="myinput">
        <button class="btn btn-primary" type="button" onclick="showResults()">Search</button>
        <button class="btn btn-primary ms-1" type="button" onclick="clearResults()">Clear</button>
      </form>
    </div>
  </div>
</nav>

<!-- This is the jumbotron section we will hide/show -->
<div id="main-welcome" class="container">
  <div class="jumbotron">
      <bold><h1 style="color: rgb(43, 47, 85);">EXPLORE<br>YOUR DREAM <br>DESTINATION</h1></bold>
      <p>Welcome to our website. Your safety is our number one priority...</p>
      <P>Search the following: Sydney, Melbourne, Tokyo, etc.</P>
      <center>
        <p><button class="btn btn-primary" type="button">Book Now</button></p>
        <p>
          <a href="#" class="fa fa-facebook"></a>
          <a href="#" class="fa fa-twitter"></a>
          <a href="#" class="fa fa-youtube"></a>
          <a href="#" class="fa fa-instagram"></a>
        </p>
      </center> 
  </div>
</div> 
  
<main id="search-results-area">
<div class="cotainer">
  <!-- Your card list follows -->
  <div id="hidden-content" class="search-item">
     <div class="card" style="width: 530px; height: 396px;">
        <img src="Sydney Australia.jpg">
        <h2>Sydney, Australia</h2>
        <h3>A country vibrant city known for its iconic landmarks.</h3>
     </div>
  </div>
  <!-- ... repeat for other cards ... -->
</div>
</main>

<script>
  function showResults() {
    const input = document.getElementById('myinput').value.toLowerCase();
    if (input !== "") {
      // Hide the welcome jumbotron[cite: 1]
      document.getElementById('main-welcome').style.display = 'none';
      // Show the search results (this connects to your travel_recommendation.js logic)
      const results = document.querySelectorAll('#hidden-content');
      results.forEach(res => res.style.display = 'block');
    }
  }

  function clearResults() {
    document.getElementById('myinput').value = "";
    // Show the welcome jumbotron again[cite: 1]
    document.getElementById('main-welcome').style.display = 'flex';
    // Hide search results
    const results = document.querySelectorAll('#hidden-content');
    results.forEach(res => res.style.display = 'none');
  }
</script>

</body>
</html>
